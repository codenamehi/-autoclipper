name: Clip uploaded video

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Download the video(s) you attached
        run: |
          mkdir -p input
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir input \
            --pattern "*.mp4" --pattern "*.MP4" --pattern "*.mov" --pattern "*.MOV" \
            --pattern "*.mkv" --pattern "*.webm"
          ls -la input
      - name: Make clips
        run: |
          for f in input/*; do
            python clipper.py "$f" --font "Liberation Sans"
          done
      - name: Attach clips to the release
        run: |
          mkdir -p upload
          for d in clips/*/; do
            n=$(basename "$d")
            for c in "$d"clip_*.mp4; do cp "$c" "upload/${n}_$(basename "$c")"; done
          done
          gh release upload "$TAG" upload/*.mp4 --repo "$GITHUB_REPOSITORY" --clobber
