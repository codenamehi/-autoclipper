name: Make clips

# Run from the "Actions" tab on GitHub: paste a link, get the clips as a download.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video link"
        required: true
      clips:
        description: "How many clips"
        default: "4"
      layout:
        description: "face, center or blur"
        default: "face"
      model:
        description: "Whisper model (tiny/base/small/medium)"
        default: "small"

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}

      - name: Make clips
        env:
          # Optional: add these under Settings > Secrets and variables > Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # passed via env (not pasted into the script) so a link can't inject shell commands
          URL: ${{ inputs.url }}
          CLIPS: ${{ inputs.clips }}
          LAYOUT: ${{ inputs.layout }}
          MODEL: ${{ inputs.model }}
        run: |
          python clipper.py "$URL" --clips "$CLIPS" --layout "$LAYOUT" \
            --model "$MODEL" --font "Liberation Sans"

      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            clips/**/*.mp4
            clips/**/clips.json
